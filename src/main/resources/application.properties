spring.application.name=online-food-order-system

# File-based H2 database: data remains after the application stops.
spring.datasource.url=jdbc:h2:file:./data/foodorders
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open http://localhost:8080/h2-console to view the database.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
